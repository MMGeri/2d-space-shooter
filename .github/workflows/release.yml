name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write       # create the release
  id-token: write       # sign build provenance
  attestations: write   # store build provenance

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main. Release from a commit that has been merged."
            exit 1
          fi

      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets are required. See https://game.ci/docs/github/activation"
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      - name: Build (Windows x64)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: Space Survivor
          versioning: None

      - name: Package
        run: |
          mkdir -p dist
          cd build/StandaloneWindows64
          zip -r "../../dist/space-survivor-${GITHUB_REF_NAME}-win-x64.zip" .

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum *.zip | tee SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Play

            Download `space-survivor-${{ github.ref_name }}-win-x64.zip`, extract it and run `Space Survivor.exe`.

            ## Verify this download

            ```
            sha256sum -c SHA256SUMS.txt
            gh attestation verify space-survivor-${{ github.ref_name }}-win-x64.zip --repo ${{ github.repository }}
            ```
            The attestation proves the file was built by this repository's release workflow from the tagged commit.
